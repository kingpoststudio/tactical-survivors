<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ashfield</title>
  </head>
  <body>
    <div id="app">
      <header>
        <div class="title">
          <h1>Ashfield</h1>
          <p id="round">Round 1</p>
          <p id="meta"></p>
        </div>
        <div id="sides"></div>
        <div id="actions">
          <label id="style-label">Style <select id="style"></select></label>
          <button id="end" type="button">End turn</button>
          <button id="reset" type="button">New battle</button>
        </div>
      </header>
      <div id="copy">
        <p id="prompt"></p>
        <p id="style-note"></p>
        <p id="detail"></p>
        <div id="level" hidden>
          <div id="offers"></div>
        </div>
      </div>
      <div id="view"></div>
      <div id="roster"></div>
      <pre id="probe" hidden></pre>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
